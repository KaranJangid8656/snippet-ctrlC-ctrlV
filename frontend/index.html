<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Snippet Saver — Save, search, and manage reusable code snippets, links, and notes in one place." />
  <title>Snippet Saver — Your Personal Code Vault</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Highlight.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" defer></script>
  <!-- Chart.js for analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <!-- ─── Header ─── -->
  <header>
    <div class="header-inner">
      <a href="#" class="logo" aria-label="Snippet Saver Home">
        <span class="logo-text">SnippetSaver</span>
      </a>
      <div class="header-actions">
        <!-- Auth Buttons -->
        <div id="authSection" class="auth-group">
          <button id="loginBtn" class="btn btn-outline" style="margin-right:8px">Login</button>
          <div id="userProfile" class="user-profile" style="display:none">
            <span id="userName" class="user-name"></span>
            <button id="logoutBtn" class="btn btn-ghost" title="Logout"><i data-lucide="log-out"
                style="width:16px;height:16px"></i></button>
          </div>
        </div>
        <a href="https://github.com/KaranJangid8656/snippet-ctrlC-ctrlV" target="_blank" class="github-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
              d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22">
            </path>
          </svg>
          GitHub Repo
        </a>
      </div>
    </div>
  </header>

  <!-- ─── Main Layout ─── -->
  <main class="main-container" role="main">

    <!-- ─── Left Sidebar: Form ─── -->
    <aside class="left-sidebar">
      <div class="panel">
        <p class="panel-title" style="display:flex;align-items:center;gap:6px;justify-content:flex-start;"><i
            data-lucide="plus-square" style="width:16px;height:16px"></i> New Snippet</p>
        <form id="snippetForm" novalidate>
          <div class="form-group">
            <label for="titleInput">Title *</label>
            <input type="text" id="titleInput" placeholder="e.g. Debounce function" maxlength="100" autocomplete="off"
              required />
          </div>
          <div class="form-group">
            <label for="contentInput">Content *</label>
            <textarea id="contentInput" placeholder="Paste your code, link, or note here..." maxlength="5000"
              required></textarea>
            <span class="char-count"><span id="charCount">0</span> / 5000</span>
          </div>

          <div class="form-group">
            <label for="folderSelect">Folder</label>
            <select id="folderSelect">
              <option value="">No Folder</option>
            </select>
          </div>
          <div class="form-group">
            <label for="tagsInput">Tags <span style="color:var(--text-muted)">(comma-separated)</span></label>
            <input type="text" id="tagsInput" placeholder="e.g. javascript, utility, hook" autocomplete="off" />
          </div>
          <button type="submit" id="submitBtn" class="btn btn-primary">
            <span id="submitText">Save Snippet</span>
          </button>
        </form>
      </div>


    </aside>

    <!-- ─── Content Area ─── -->
    <section class="content-area">

      <!-- Search -->
      <div class="search-wrapper" role="search">
        <i data-lucide="search" class="search-icon" style="width:16px;height:16px" aria-hidden="true"></i>
        <input type="text" id="searchInput" placeholder="Search snippets by title, tag, or content..."
          aria-label="Search snippets" autocomplete="off" />
        <button class="clear-search" id="clearSearch" aria-label="Clear search" title="Clear"><i data-lucide="x"
            style="width:14px;height:14px"></i></button>
      </div>

      <!-- Active Tag Filter Banner -->
      <div class="active-filter-banner" id="filterBanner">
        <span style="display:flex;align-items:center;gap:6px;"><i data-lucide="tag" style="width:14px;height:14px"></i>
          Filtering by tag: <strong id="activeTagLabel"></strong></span>
        <button class="clear-filter-btn" id="clearTagFilter">Clear filter</button>
      </div>

      <!-- Filter Bar -->
      <div class="filter-bar" id="filterBar" role="group" aria-label="Filter snippets">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="favorites" style="display:flex;align-items:center;gap:4px;"><i
            data-lucide="star" style="width:12px;height:12px"></i> Favorites</button>
      </div>

      <!-- Snippets Header -->
      <div class="snippets-header">
        <span class="snippets-count" id="snippetsCountLabel">Showing <strong>0</strong> snippets</span>
        <select class="sort-select" id="sortSelect" aria-label="Sort snippets">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="title">A → Z</option>
        </select>
      </div>

      <!-- Snippets Grid -->
      <div id="snippetsGrid" role="list" aria-label="Saved snippets">
        <div class="loader">
          <div class="spinner"></div>
        </div>
      </div>

    </section>

    <!-- ─── Right Sidebar: Folders & Stats ─── -->
    <aside class="right-sidebar">
      <!-- Folders Panel -->
      <div id="foldersPanel" class="panel" style="display:none">
        <div class="panel-header"
          style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem">
          <p class="panel-title" style="margin:0; display:flex;align-items:center;gap:6px;"><i data-lucide="folder"
              style="width:16px;height:16px"></i> Folders</p>
          <button id="addFolderBtn" class="action-btn" title="New Folder">+</button>
        </div>
        <div id="foldersList" class="folders-list">
          <!-- Folders injected here -->
        </div>
      </div>

      <div class="panel stats-panel">
        <p class="panel-title" style="display:flex;align-items:center;gap:6px;justify-content:flex-start;"><i
            data-lucide="pie-chart" style="width:16px;height:16px"></i> Analytics</p>
        <div class="stat-group">
          <span class="stat-label">Total Snippets</span>
          <strong class="stat-value" id="totalCount">0</strong>
        </div>
        <div class="stat-group">
          <span class="stat-label">Favorites</span>
          <strong class="stat-value" id="favCount">0</strong>
        </div>

        <div class="stats-section">
          <p class="stats-section-title">Languages Breakdown</p>
          <div style="position: relative; height: 180px; width: 100%; margin-top: 10px;">
            <canvas id="languageChart"></canvas>
          </div>
        </div>
      </div>
    </aside>

  </main>

  <!-- ─── Toast ─── -->
  <div id="toast" role="alert" aria-live="polite">
    <span class="toast-icon" id="toastIcon"></span>
    <span id="toastMsg"></span>
  </div>

  <!-- ─── Auth Modal ─── -->
  <div id="authModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-container auth-modal">
      <div class="modal-header">
        <h2 id="authModalTitle">Login</h2>
        <button id="closeAuthModal" class="action-btn" aria-label="Close modal">✕</button>
      </div>
      <div class="modal-body">
        <form id="authForm">
          <div class="form-group" id="nameGroup" style="display:none">
            <label for="authName">Full Name</label>
            <input type="text" id="authName" placeholder="John Doe" />
          </div>
          <div class="form-group">
            <label for="authEmail">Email</label>
            <input type="email" id="authEmail" placeholder="john@example.com" required />
          </div>
          <div class="form-group">
            <label for="authPassword">Password</label>
            <input type="password" id="authPassword" placeholder="••••••••" required />
          </div>
          <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="margin-top:1rem">Login</button>
        </form>
        <p class="auth-toggle">
          <span id="authToggleText">Don't have an account?</span>
          <a href="#" id="authToggleBtn">Sign Up</a>
        </p>
      </div>
    </div>
  </div>

  <!-- ─── Folder Modal ─── -->
  <div id="folderModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-container auth-modal">
      <div class="modal-header">
        <h2>Create Folder</h2>
        <button id="closeFolderModal" class="action-btn" aria-label="Close modal">✕</button>
      </div>
      <div class="modal-body" style="background: #fff; padding: 2rem;">
        <form id="folderForm">
          <div class="form-group">
            <label for="newFolderName">Folder Name</label>
            <input type="text" id="newFolderName" placeholder="e.g. Work Snippets" maxlength="30" required />
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:1rem">Create Folder</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ─── Snippet Preview Modal ─── -->
  <div id="previewModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="modalTitle">Snippet Title</h2>
        <div style="display:flex; gap:4px">
          <button id="modalCopyBtn" class="action-btn copy-btn" title="Copy content"
            aria-label="Copy content">⧉</button>
          <button id="modalFavBtn" class="action-btn fav-btn" title="Star" aria-label="Toggle favorite">☆</button>
          <button id="closeModalBtn" class="action-btn" aria-label="Close modal">✕</button>
        </div>
      </div>
      <div class="modal-body">
        <pre><code id="modalContent"></code></pre>
      </div>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>

</html>
